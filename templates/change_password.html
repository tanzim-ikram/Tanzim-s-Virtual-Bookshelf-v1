{% extends "admin_base.html" %}

{% block title %}Change password · Tanzim's Virtual Bookshelf{% endblock %}

{% block admin_content %}
<div class="page-head"><h1>Change password</h1></div>

<form class="card" method="post" action="{{ url_for('change_password') }}" data-ajax data-reset>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="field">
    <label for="current_password">Current password</label>
    <div class="pw">
      <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
      <button type="button" data-toggle-password="current_password">Show</button>
    </div>
  </div>

  <div class="field">
    <label for="new_password">New password</label>
    <div class="pw">
      <input type="password" id="new_password" name="new_password" autocomplete="new-password" minlength="8" required>
      <button type="button" data-toggle-password="new_password">Show</button>
    </div>
    <span class="hint">At least 8 characters.</span>
  </div>

  <div class="field">
    <label for="retype_password">Retype new password</label>
    <div class="pw">
      <input type="password" id="retype_password" name="retype_password" autocomplete="new-password" minlength="8" required>
      <button type="button" data-toggle-password="retype_password">Show</button>
    </div>
  </div>

  <p class="form-status" role="status" aria-live="polite"></p>
  <div class="form-actions">
    <button type="submit" class="btn">Update password</button>
    <a class="btn quiet" href="{{ url_for('dashboard') }}">Cancel</a>
  </div>
</form>
{% endblock %}
