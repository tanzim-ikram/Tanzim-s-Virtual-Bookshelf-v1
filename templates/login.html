{% extends "base.html" %}

{% block title %}Log in · Tanzim's Virtual Bookshelf{% endblock %}

{% block content %}
<div class="auth">
  <h1>Admin log in</h1>
  <form class="card" method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" required autofocus>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw">
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" data-toggle-password="password">Show</button>
      </div>
    </div>

    <label class="check">
      <input type="checkbox" id="rememberMe" name="rememberMe">
      <span>Keep me logged in</span>
    </label>

    <button type="submit" class="btn">Log in</button>
  </form>
  <p class="below"><a href="{{ url_for('home') }}">&larr; Back to the shelf</a></p>
</div>
{% endblock %}
